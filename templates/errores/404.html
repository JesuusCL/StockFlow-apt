{% extends 'base.html' %}
{% block title %}Pagina no encontrada{% endblock %}

{% block content %}
<div class="empty-state">
    <h1 class="h4 mb-2">Pagina no encontrada</h1>
    <p>El recurso que buscas no existe o no esta disponible para tu cuenta.</p>
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}"
       class="btn btn-dark mt-2">
        Volver
    </a>
</div>
{% endblock %}
